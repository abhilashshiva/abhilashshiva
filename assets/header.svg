  <circle cx="120" cy="45" r="2.5" fill="#a78bfa" opacity="0.5"/>
  <circle cx="760" cy="55" r="3.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="790" cy="85" r="2" fill="#818cf8" opacity="0.4"/>

